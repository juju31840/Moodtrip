name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      # Pas de build ici : il exige les clés d'API (Mapbox, Supabase...). Les tests
      # automatisés restent à écrire (voir verify-itinerary-contract).
